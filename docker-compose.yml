# Local development with production-shaped services: Postgres instead of SQLite,
# gunicorn instead of runserver. `docker compose up` and the whole site runs.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://portfolio:portfolio@db:5432/portfolio
      DJANGO_SECRET_KEY: local-development-only-not-a-real-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SECURE_SSL_REDIRECT: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media

  # Seeds the demo persona once the API is healthy, then exits.
  seed:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://portfolio:portfolio@db:5432/portfolio
      DJANGO_SECRET_KEY: local-development-only-not-a-real-secret
    depends_on:
      api:
        condition: service_healthy
    command: python manage.py seed_demo
    volumes:
      - media:/app/media
    restart: "no"

  web:
    image: node:24-slim
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules

volumes:
  pgdata:
  media:
  node_modules:
