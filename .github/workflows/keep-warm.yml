name: Keep the API warm

# Render's free tier sleeps after ~15 minutes of inactivity and takes up to a
# minute to wake. A recruiter following the link should never wait for that, so
# this pings the health endpoint often enough to keep the instance up.
#
# Set the API_HEALTH_URL repository variable to your Render health URL, e.g.
#   https://portfolio-api.onrender.com/api/health/
# (Settings -> Secrets and variables -> Actions -> Variables)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          URL="${{ vars.API_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "API_HEALTH_URL is not set — skipping. See this file's header."
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 "$URL"; then
              echo "" && echo "API is awake."
              exit 0
            fi
            echo "Attempt $attempt failed; the instance may be starting. Retrying…"
            sleep 20
          done
          echo "::warning::Could not reach $URL after three attempts."
