[project]
name = "portfolio-backend"
version = "0.1.0"
description = "Django REST backend for the portfolio site — the single source of truth for all site content."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<5.3",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "dj-database-url>=2.2",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
    "pillow>=10.4",
    "django-storages>=1.14",
    "cloudinary>=1.41",
    "django-cloudinary-storage>=0.3",
    "django-admin-sortable2>=2.2",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
    "django-stubs-ext>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "types-jsonschema>=4.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "DJ"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["cloudinary.*", "cloudinary_storage.*", "adminsortable2.*", "factory.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
